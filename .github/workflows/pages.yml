name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Settings → Secrets and variables → Actions → Variables.
      # Indirizzo del Worker squadify-api (catalogo Spotify senza login). Se manca, l'app gira con il catalogo di prova.
      VITE_SQUADIFY_API: ${{ vars.VITE_SQUADIFY_API }}
      # Facoltativo: Client ID dell'app Spotify, per il login "usa i tuoi ascolti" (solo utenti in allowlist).
      VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
      VITE_SHARE_URL: https://sambrosio17.github.io/squadify/
    steps:
      - uses: actions/checkout@v4
      - name: Controlla le variabili
        run: |
          if [ -z "$VITE_SQUADIFY_API" ]; then
            echo "::warning::Manca VITE_SQUADIFY_API: il sito userà il catalogo di prova (solo nomi). Vedi worker/README.md."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/la-formazione/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
